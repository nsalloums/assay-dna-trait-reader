name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python floor is 3.12, set by numpy==2.5.1 (requires-python >=3.12).
        # Do not add 3.11: pip cannot resolve the pinned deps there.
        # Windows is not optional — it is the primary development platform here
        # (.claude/launch.json hardcodes .venv/Scripts/python.exe), so a Windows-only
        # break would otherwise be invisible.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt   # -r requirements.txt is nested inside

      # The synthetic corpus is generated by the pytest fixture into a temp dir, so no
      # separate make_corpus step is needed. Test data is always synthetic; a real human
      # DNA file must never enter this repo or this workflow.
      - name: Run tests
        run: python -m pytest tests/ -q

  privacy:
    # Split out from the matrix deliberately: this is the project's central claim, and a
    # named job makes it legible on the PR page and in the badge. It proves that
    # parse -> annotate completes with every socket banned, that no rsID reaches disk,
    # and that the annotation DB is opened read-only.
    name: Privacy invariants (no egress, no persistence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Prove no egress and no on-disk persistence
        run: python -m pytest tests/test_privacy_g3.py -v

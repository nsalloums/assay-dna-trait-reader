version: 2
updates:
  # Runtime deps are pinned exactly (requirements.txt) because reproducibility of the
  # annotation pipeline matters more than being on the newest release. Dependabot is
  # here to surface security fixes, not to churn the pins.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
